name: Verify and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node --test tests/test_share_card.cjs
      - run: git diff --check
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python -c "import os, token_footprint; assert os.environ['GITHUB_REF_NAME'] == 'v' + token_footprint.__version__"
      - run: python -m pip install build==1.2.2.post1
      - run: python -m build
      - run: python scripts/verify_wheel.py
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git archive --format=zip --output="dist/TokenMe-${TAG}-source.zip" HEAD
          gh release create "$TAG" dist/* --verify-tag --title "TokenMe $TAG" --notes-file "docs/release-${TAG}.md"
